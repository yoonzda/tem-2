<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="admin-title">통합 관리자 콘솔 - ADMIN STUDIO</title>
  
  <!-- Premium Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap">
  
  <style>
    :root {
      /* Colors */
      --bg-body: #f8fafc;
      --bg-surface: #ffffff;
      --bg-elevated: #f1f5f9;
      --sidebar-bg: #0f172a;
      --sidebar-subtle: #1e293b;
      --sidebar-border: #334155;
      
      --border-color: #e2e8f0;
      --border-subtle: #f1f5f9;
      --border-strong: #cbd5e1;
      
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --text-white: #ffffff;
      
      /* Primary Brand & Accents */
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --primary-border: #c7d2fe;
      
      --success: #10b981;
      --success-bg: #ecfdf5;
      --success-border: #a7f3d0;
      --success-text: #065f46;
      
      --warning: #f59e0b;
      --warning-bg: #fffbeb;
      --warning-border: #fde68a;
      --warning-text: #92400e;
      
      --danger: #ef4444;
      --danger-bg: #fef2f2;
      --danger-border: #fecaca;
      --danger-text: #991b1b;
      
      --info: #0284c7;
      --info-bg: #f0f9ff;
      --info-border: #bae6fd;
      --info-text: #075985;
      
      --font-family: 'Pretendard', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --transition-fast: 0.15s ease;
      --transition-normal: 0.25s ease;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-size: 15px;
      line-height: 1.5;
      overflow-x: hidden;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-body);
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* ==========================================================================
       1. Top Header
       ========================================================================== */
    .admin-header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      position: sticky;
      top: 0;
      z-index: 500;
      box-shadow: var(--shadow-sm);
    }

    .admin-logo-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .admin-brand-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(79, 70, 229, 0.3);
    }

    .admin-logo-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .admin-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid var(--primary-border);
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .admin-user-nav {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .user-profile-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 10px;
      background: var(--bg-elevated);
      border-radius: 20px;
      border: 1px solid var(--border-color);
    }

    .user-avatar {
      width: 26px;
      height: 26px;
      background: #4f46e5;
      color: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
    }

    .user-name {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-primary);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 38px;
      padding: 0 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      border-radius: 8px;
      border: 1.5px solid transparent;
      transition: all var(--transition-fast);
      text-decoration: none;
      user-select: none;
    }

    .btn-sm {
      height: 32px;
      padding: 0 12px;
      font-size: 13px;
      border-radius: 6px;
    }

    .btn-xs {
      height: 28px;
      padding: 0 9px;
      font-size: 12px;
      border-radius: 5px;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 2px 6px rgba(79, 70, 229, 0.2);
    }
    .btn-primary:hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
      box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);
    }

    .btn-secondary {
      background: var(--bg-surface);
      color: var(--text-secondary);
      border-color: var(--border-color);
      box-shadow: var(--shadow-sm);
    }
    .btn-secondary:hover {
      background: var(--bg-elevated);
      color: var(--text-primary);
      border-color: var(--border-strong);
    }

    .btn-success {
      background: var(--success);
      color: #ffffff;
      border-color: var(--success);
    }
    .btn-success:hover {
      background: #059669;
    }

    .btn-danger {
      background: var(--danger);
      color: #ffffff;
      border-color: var(--danger);
    }
    .btn-danger:hover {
      background: #dc2626;
    }

    .btn-ghost-danger {
      background: transparent;
      color: var(--danger-text);
      border-color: var(--danger-border);
    }
    .btn-ghost-danger:hover {
      background: var(--danger-bg);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-secondary);
      border-color: transparent;
    }
    .btn-ghost:hover {
      background: var(--bg-elevated);
      color: var(--text-primary);
    }

    /* ==========================================================================
       2. Body & Sidebar Layout
       ========================================================================== */
    .admin-body {
      display: flex;
      flex: 1;
      min-height: calc(100vh - 64px);
    }

    .admin-sidebar {
      width: 260px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--sidebar-border);
      padding: 20px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
    }

    .sidebar-group {
      margin-bottom: 16px;
    }

    .sidebar-section-title {
      font-size: 11.5px;
      font-weight: 800;
      color: #64748b;
      letter-spacing: 0.8px;
      padding: 8px 12px 6px 12px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sidebar-menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      color: #94a3b8;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border-radius: 8px;
      transition: all var(--transition-fast);
      user-select: none;
    }

    .sidebar-menu-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sidebar-menu-icon {
      width: 18px;
      height: 18px;
      opacity: 0.8;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .sidebar-menu-item:hover {
      background: rgba(255, 255, 255, 0.06);
      color: #f1f5f9;
    }

    .sidebar-menu-item.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35);
    }
    .sidebar-menu-item.active .sidebar-menu-icon {
      opacity: 1;
    }

    .sidebar-counter {
      padding: 2px 6px;
      background: #334155;
      color: #f1f5f9;
      font-size: 11px;
      font-weight: 700;
      border-radius: 10px;
    }
    .sidebar-menu-item.active .sidebar-counter {
      background: rgba(255, 255, 255, 0.25);
      color: #ffffff;
    }

    /* Submenu Item */
    .sidebar-submenu-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px 8px 38px;
      color: #94a3b8;
      font-size: 13.5px;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      border-radius: 6px;
      transition: all var(--transition-fast);
      position: relative;
    }
    .sidebar-submenu-item::before {
      content: '';
      position: absolute;
      left: 24px;
      top: 50%;
      transform: translateY(-50%);
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #475569;
      transition: all var(--transition-fast);
    }
    .sidebar-submenu-item:hover {
      background: rgba(255, 255, 255, 0.04);
      color: #f1f5f9;
    }
    .sidebar-submenu-item:hover::before {
      background: #94a3b8;
    }
    .sidebar-submenu-item.active {
      background: rgba(79, 70, 229, 0.2);
      color: #818cf8;
      font-weight: 700;
    }
    .sidebar-submenu-item.active::before {
      background: #818cf8;
      width: 6px;
      height: 6px;
    }

    /* ==========================================================================
       3. Main Workspace & Cards
       ========================================================================== */
    .admin-workspace {
      flex: 1;
      padding: 32px 36px 60px 36px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .workspace-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .workspace-title-wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .workspace-breadcrumb {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .workspace-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.4px;
    }

    .workspace-desc {
      font-size: 14px;
      color: var(--text-secondary);
    }

    /* Stat KPI Cards */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .kpi-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all var(--transition-fast);
    }
    .kpi-card:hover {
      box-shadow: var(--shadow-md);
    }

    .kpi-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .kpi-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .kpi-value {
      font-size: 26px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.5px;
    }

    .kpi-icon-wrap {
      width: 46px;
      height: 46px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .kpi-icon-primary { background: #eef2ff; color: #4f46e5; }
    .kpi-icon-amber { background: #fffbeb; color: #d97706; }
    .kpi-icon-emerald { background: #ecfdf5; color: #059669; }
    .kpi-icon-sky { background: #f0f9ff; color: #0284c7; }

    /* Calendar Interactive Month Grid */
    .admin-cal-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    .cal-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: #f8fafc;
      border-bottom: 1px solid var(--border-color);
    }
    .cal-month-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .cal-grid-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    .cal-grid-table th {
      background: #f8fafc;
      padding: 12px 8px;
      text-align: center;
      font-size: 13.5px;
      font-weight: 700;
      color: #64748b;
      border-bottom: 1px solid var(--border-color);
    }
    .cal-grid-table th.th-sun { color: #ef4444; }
    .cal-grid-table th.th-sat { color: #3b82f6; }
    .cal-grid-table td {
      border: 1px solid #f1f5f9;
      height: 96px;
      vertical-align: top;
      padding: 8px;
      background: #ffffff;
      transition: background 0.15s ease;
      cursor: pointer;
    }
    .cal-grid-table td:hover {
      background: #f8fafc;
    }
    .cal-grid-table td.empty-cell {
      background: #fafafa;
      cursor: default;
    }
    .cal-date-num {
      font-size: 13.5px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 6px;
      display: inline-block;
    }
    .cal-date-num.is-sun { color: #ef4444; }
    .cal-date-num.is-sat { color: #3b82f6; }
    .cal-date-num.is-today {
      background: var(--primary);
      color: #ffffff;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      text-align: center;
      line-height: 22px;
    }
    .cal-event-chip {
      font-size: 11.5px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }
    .cal-event-blue { background: #e0f2fe; color: #0284c7; }
    .cal-event-indigo { background: #e0e7ff; color: #4338ca; }
    .cal-event-emerald { background: #dcfce7; color: #15803d; }
    .cal-event-amber { background: #fef3c7; color: #b45309; }
    .cal-event-rose { background: #ffe4e6; color: #e11d48; }

    /* Card Container */
    .card-container {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .card-header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .card-title {
      font-size: 16.5px;
      font-weight: 800;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-body {
      padding: 24px;
    }

    /* Filter & Search Bar */
    .control-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
      padding: 16px 24px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
    }

    .control-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .control-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Form Controls */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .form-input, .form-select, .form-textarea {
      height: 38px;
      padding: 0 14px;
      background: var(--bg-surface);
      border: 1.5px solid var(--border-color);
      color: var(--text-primary);
      font-size: 14px;
      border-radius: 8px;
      outline: none;
      transition: all var(--transition-fast);
    }

    .form-textarea {
      height: auto;
      padding: 10px 14px;
      min-height: 100px;
      resize: vertical;
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
    }

    /* Table Styles */
    .table-responsive {
      width: 100%;
      overflow-x: auto;
    }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
    }

    .admin-table th {
      background: #f8fafc;
      color: var(--text-secondary);
      font-weight: 700;
      font-size: 13px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-color);
      letter-spacing: -0.1px;
      white-space: nowrap;
    }

    .admin-table td {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-primary);
      vertical-align: middle;
    }

    .admin-table tbody tr {
      transition: background-color var(--transition-fast);
    }

    .admin-table tbody tr:hover {
      background: #f8fafc;
    }

    /* Status Pill Badges */
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: -0.2px;
      white-space: nowrap;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      display: inline-block;
    }

    .status-wait {
      background: var(--warning-bg);
      color: var(--warning-text);
      border: 1px solid var(--warning-border);
    }
    .status-wait .status-dot { background: var(--warning); }

    .status-approved {
      background: var(--success-bg);
      color: var(--success-text);
      border: 1px solid var(--success-border);
    }
    .status-approved .status-dot { background: var(--success); }

    .status-complete {
      background: var(--info-bg);
      color: var(--info-text);
      border: 1px solid var(--info-border);
    }
    .status-complete .status-dot { background: var(--info); }

    .status-cancelled {
      background: var(--danger-bg);
      color: var(--danger-text);
      border: 1px solid var(--danger-border);
    }
    .status-cancelled .status-dot { background: var(--danger); }

    .status-rejected {
      background: var(--bg-elevated);
      color: var(--text-secondary);
      border: 1px solid var(--border-strong);
    }
    .status-rejected .status-dot { background: var(--text-muted); }

    /* Table Footer & Pagination */
    .table-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      background: var(--bg-surface);
      border-top: 1px solid var(--border-color);
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* Program Cards Grid (For Program Manage Section) */
    .programs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px;
    }

    .program-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 22px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: all var(--transition-fast);
    }
    .program-card:hover {
      box-shadow: var(--shadow-md);
      border-color: var(--primary-border);
    }

    .program-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .program-tag {
      font-size: 12px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--primary-light);
      color: var(--primary);
    }

    .program-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.4;
    }

    .program-meta {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .program-meta-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .quota-bar-wrap {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .quota-info {
      display: flex;
      justify-content: space-between;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: var(--bg-elevated);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 4px;
    }

    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
      animation: fadeIn 0.15s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      box-shadow: var(--shadow-lg);
      padding: 28px 32px;
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-color);
    }

    .modal-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 10px;
      padding-top: 16px;
      border-top: 1px solid var(--border-color);
    }

    /* Login Box Overlay */
    .login-overlay {
      position: fixed;
      inset: 0;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      padding: 36px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .login-header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .login-icon-box {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
      margin-bottom: 4px;
    }

    /* Toast Notification */
    .admin-toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: #0f172a;
      color: #ffffff;
      padding: 12px 20px;
      border-radius: 10px;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 700;
      z-index: 9999;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }
    .admin-toast.show {
      opacity: 1;
      transform: translateY(0);
    }
    .admin-toast-success {
      border-left: 4px solid var(--success);
    }

    /* Toggle Switch */
    .switch-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #cbd5e1;
      transition: .3s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: var(--primary);
    }
    input:checked + .slider:before {
      transform: translateX(20px);
    }
  </style>
</head>
<body>

  <!-- 1. Login Modal -->
  <div class="login-overlay" id="admin-login-overlay" style="display:none;">
    <div class="login-box">
      <div class="login-header">
        <div class="login-icon-box">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <h2 style="font-size:20px; font-weight:800; color:var(--text-primary);">통합 관리자 로그인</h2>
        <p style="font-size:13.5px; color:var(--text-secondary);">시스템 관리를 위해 인증 정보를 입력해주세요.</p>

      <form id="admin-login-form" style="display:flex; flex-direction:column; gap:16px;">

          <label class="form-label" for="login-id">관리자 아이디</label>

  </div>

  <!-- 2. Admin Header -->
  <header class="admin-header">
    <div class="admin-logo-wrap">
      <div class="admin-brand-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
      </div>
      <div class="admin-logo-title">
        <span id="admin-site-title">ADMIN STUDIO</span>
        <span class="admin-badge">Console</span>
      </div>
    </div>

    <div class="admin-user-nav">
      <div class="user-profile-badge">
        <div class="user-avatar">A</div>
        <span class="user-name" id="admin-display-name">최고관리자 (admin)</span>
      </div>
      <a href="user_preview.html" target="_blank" class="btn btn-secondary btn-sm">
        <span>사용자 사이트</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
      </a>
      <button class="btn btn-ghost-danger btn-sm" id="btn-admin-logout">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>로그아웃</span>
      </button>
    </div>
  </header>

  <!-- 3. Body Layout -->
  <div class="admin-body">
    <!-- Sidebar -->
    <aside class="admin-sidebar" id="admin-dynamic-sidebar">
      <!-- Injected by JS -->
    </aside>

    <!-- Main Workspace -->
    <main class="admin-workspace" id="admin-workspace-root">
      <!-- Injected by JS -->
    </main>
  </div>

  <!-- Modal Mount Root -->
  <div id="admin-modal-root"></div>

  <!-- Toast Notification -->
  <div id="admin-toast" class="admin-toast admin-toast-success">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
      <polyline points="22 4 12 14.01 9 11.01"></polyline>
    </svg>
    <span id="toast-text">처리가 완료되었습니다.</span>
  </div>

  <!-- Logic Script -->
  <script>
    (function() {
      const STORAGE_KEY = 'WEB_BUILDER_STUDIO_STATE_V3';
      const LOCAL_APPLIES_KEY = 'WEB_BUILDER_LOCAL_APPLIES_V1';

      function getBuilderState() {
        try {
          if (window.opener && window.opener.builderStore) {
            const st = window.opener.builderStore.getState();
            if (st && st.siteInfo) return st;
          }
          const saved = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('WEB_BUILDER_STUDIO_STATE_V1');
          if (saved) return JSON.parse(saved);
        } catch (e) {}
        return null;
      }

      let state = getBuilderState() || {
        siteInfo: { siteTitle: 'MY WEBSITE', companyName: 'MY COMPANY' },
        adminAuth: { adminId: 'admin', adminPw: 'admin1234' },
        menus: [],
        pageOptions: {},
        features: {}
      };

      // Realtime cross-tab synchronization with builder
      window.addEventListener('storage', (e) => {
        if (e.key === STORAGE_KEY) {
          const fresh = getBuilderState();
          if (fresh) {
            state = fresh;
            initAdmin();
          }
        }
      });

      let activeSection = 'dashboard';

      function showToast(message) {
        const toast = document.getElementById('admin-toast');
        const text = document.getElementById('toast-text');
        if (toast && text) {
          text.textContent = message;
          toast.classList.add('show');
          setTimeout(() => {
            toast.classList.remove('show');
          }, 2400);
        }
      }

      function seedDummyApplies() {
        let applies = JSON.parse(localStorage.getItem(LOCAL_APPLIES_KEY) || '[]');
        if (applies.length === 0) {
          applies = [
            { id: 'REG-2609-001', program: '2026 주간 활동 맞춤 프로그램', name: '김철수', phone: '010-1234-5678', count: 1, status: '접수대기', date: '2026-08-19' },
            { id: 'REG-2609-002', program: '2026 주간 활동 맞춤 프로그램', name: '이영희', phone: '010-9876-5432', count: 2, status: '승인완료', date: '2026-08-18' },
            { id: 'REG-2609-003', program: '주말 특별 문화체험 교실', name: '박민수', phone: '010-5555-4444', count: 1, status: '신청취소', date: '2026-08-17' },
            { id: 'REG-2609-004', program: '2026 주간 활동 맞춤 프로그램', name: '최동훈', phone: '010-7777-8888', count: 1, status: '대기자', date: '2026-08-19' }
          ];
          localStorage.setItem(LOCAL_APPLIES_KEY, JSON.stringify(applies));
        }
      }

      function initAdmin() {
        seedDummyApplies();
        
        // Update Brand Title
        const siteTitle = state.siteInfo?.siteTitle || 'ADMIN STUDIO';
        document.getElementById('admin-site-title').textContent = siteTitle;
        document.getElementById('admin-title').textContent = `${siteTitle} - 통합 관리자 콘솔`;
        document.getElementById('admin-display-name').textContent = `최고관리자 (${state.adminAuth?.adminId || 'admin'})`;

        document.getElementById('login-id').value = state.adminAuth.adminId || 'admin';
        document.getElementById('login-pw').value = state.adminAuth.adminPw || 'admin1234';

        renderSidebar();
        renderWorkspace(activeSection);
      }

      document.getElementById('admin-login-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const id = document.getElementById('login-id').value.trim();
        const pw = document.getElementById('login-pw').value.trim();

        if (id === (state.adminAuth.adminId || 'admin') && pw === (state.adminAuth.adminPw || 'admin1234')) {
          document.getElementById('admin-login-overlay').style.display = 'none';
          showToast('성공적으로 로그인되었습니다.');
          renderSidebar();
          renderWorkspace(activeSection);
        } else {
          alert('아이디 또는 비밀번호가 일치하지 않습니다.');
        }
      });

      document.getElementById('btn-admin-logout').addEventListener('click', () => {
        document.getElementById('admin-login-overlay').style.display = 'flex';
      });

      function renderSidebar() {
        const sidebar = document.getElementById('admin-dynamic-sidebar');
        const pageOptions = state.pageOptions || {};

        const contentMenus = [];
        const programMenus = [];

        (state.menus || []).forEach(main => {
          (main.submenus || []).forEach(sub => {
            const opt = pageOptions[sub.id] || {};
            const pType = opt.type || (
              sub.name.includes('프로그램') ? 'program' :
              sub.name.includes('갤러리') || sub.name.includes('사진') ? 'gallery' :
              sub.name.includes('캘린더') || sub.name.includes('일정') ? 'calendar' :
              sub.name.includes('연혁') || sub.name.includes('히스토리') ? 'history' :
              sub.name.includes('자료') ? 'archive' :
              sub.name.includes('FAQ') || sub.name.includes('질문') ? 'faq' :
              sub.name.includes('소개') ? 'about' :
              sub.name.includes('문의') || sub.name.includes('상담') ? 'contact' :
              sub.name.includes('오시는길') || sub.name.includes('지도') ? 'map' : 'board'
            );

            const item = {
              id: sub.id,
              name: sub.name,
              mainName: main.name,
              type: pType
            };

            if (pType === 'program') {
              programMenus.push(item);
            } else {
              contentMenus.push(item);
            }
          });
        });

        const applies = JSON.parse(localStorage.getItem(LOCAL_APPLIES_KEY) || '[]');
        const pendingCount = applies.filter(a => a.status === '접수대기').length;

        const getIconForType = (type) => {
          switch(type) {
            case 'history':
              return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>`;
            case 'gallery':
              return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>`;
            case 'archive':
              return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>`;
            case 'faq':
              return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>`;
            case 'calendar':
              return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>`;
            case 'about':
              return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>`;
            case 'contact':
              return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>`;
            case 'map':
              return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>`;
            default:
              return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>`;
          }
        };

        const typeLabels = {
          history: '연혁',
          calendar: '캘린더',
          board: '게시판',
          gallery: '갤러리',
          archive: '자료실',
          faq: 'FAQ',
          program: '프로그램',
          about: '소개',
          contact: '온라인상담',
          map: '오시는길'
        };

        sidebar.innerHTML = `
          <!-- 1. Dashboard -->
          <div class="sidebar-group">
            <div class="sidebar-section-title">Overview</div>
            <a class="sidebar-menu-item ${activeSection === 'dashboard' ? 'active' : ''}" data-sec="dashboard">
              <div class="sidebar-menu-left">
                <span class="sidebar-menu-icon">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg>
                </span>
                <span>메인 대시보드</span>
              </div>
            </a>
          </div>

          <!-- 2. Site Menus & Content Pages (Strict 1:1 Mirror of Step 1 & Step 2) -->
          <div class="sidebar-group">
            <div class="sidebar-section-title">Site Menus (${contentMenus.length + programMenus.length})</div>
            ${[...programMenus, ...contentMenus].length > 0 ? [...programMenus, ...contentMenus].map(m => `
              <a class="sidebar-menu-item ${activeSection === 'menu_' + m.id || activeSection === 'board_' + m.id ? 'active' : ''}" data-sec="menu_${m.id}">
                <div class="sidebar-menu-left">
                  <span class="sidebar-menu-icon">
                    ${getIconForType(m.type)}
                  </span>
                  <span>${m.name}</span>
                </div>
                <div style="display:flex; align-items:center; gap:6px;">
                  <span style="font-size:11px; padding:2px 6px; border-radius:4px; background:#f1f5f9; color:#475569; font-weight:700;">${typeLabels[m.type] || '게시판'}</span>
                  ${m.type === 'program' && pendingCount > 0 ? `<span class="sidebar-counter" style="background:#f59e0b; color:#fff;">${pendingCount}</span>` : ''}
                </div>
              </a>
            `).join('') : `
              <a class="sidebar-menu-item ${activeSection === 'board_default' ? 'active' : ''}" data-sec="board_default">
                <div class="sidebar-menu-left">
                  <span class="sidebar-menu-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path></svg>
                  </span>
                  <span>공지사항 관리</span>
                </div>
              </a>
            `}
          </div>

          <!-- 3. Operations & Settings -->
          <div class="sidebar-group">
            <div class="sidebar-section-title">Settings & Operations</div>
            <a class="sidebar-menu-item ${activeSection === 'popup_manage' ? 'active' : ''}" data-sec="popup_manage">
              <div class="sidebar-menu-left">
                <span class="sidebar-menu-icon">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
                </span>
                <span>팝업 / 띠배너 관리</span>
              </div>
            </a>
            <a class="sidebar-menu-item ${activeSection === 'settings' ? 'active' : ''}" data-sec="settings">
              <div class="sidebar-menu-left">
                <span class="sidebar-menu-icon">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                </span>
                <span>환경 설정</span>
              </div>
            </a>
          </div>
        `;

        sidebar.querySelectorAll('[data-sec]').forEach(el => {
          el.addEventListener('click', () => {
            activeSection = el.getAttribute('data-sec');
            renderSidebar();
            renderWorkspace(activeSection);
          });
        });
      }

      // =========================================================================
      // Dynamic Calendar System for Admin
      // =========================================================================
      let adminCalYear = 2026;
      let adminCalMonth = 9;

      function generateAdminCalendarHtml(year, month, calTitle) {
        const monthKey = `${year}-${String(month).padStart(2, '0')}`;
        const events = ADMIN_CALENDAR_EVENTS[monthKey] || [
          { day: 5, title: `${calTitle} 정기 교육`, type: 'blue', label: '교육', time: '10:00 - 12:00' },

        ];

        const firstDayOfWeek = new Date(year, month - 1, 1).getDay(); // 0 = Sun
        const totalDays = new Date(year, month, 0).getDate();

        let rowsHtml = '<tr>';
        let currentCellIndex = 0;

        for (let i = 0; i < firstDayOfWeek; i++) {
          rowsHtml += '<td class="empty-cell"></td>';
          currentCellIndex++;
        }

        for (let day = 1; day <= totalDays; day++) {
          const dayOfWeek = (firstDayOfWeek + day - 1) % 7;
          const isSun = dayOfWeek === 0;
          const isSat = dayOfWeek === 6;
          const isToday = year === 2026 && month === 9 && day === 15;

          const dayEvents = events.filter(e => e.day === day);
          const eventsChipsHtml = dayEvents.map(e => `
            <span class="cal-event-chip cal-event-${e.type}" title="${e.title} (${e.time})">${e.title}</span>
          `).join('');

          const clickAction = dayEvents.length > 0
            ? `showToast('${month}월 ${day}일 [${dayEvents[0].title}] 일정을 수정합니다.')`
            : `showToast('${month}월 ${day}일 새 일정을 등록합니다.')`;

          rowsHtml += `
            <td onclick="${clickAction}">
              <span class="cal-date-num ${isToday ? 'is-today' : isSun ? 'is-sun' : isSat ? 'is-sat' : ''}">${day}</span>
              ${eventsChipsHtml}
            </td>
          `;
          currentCellIndex++;

          if (currentCellIndex % 7 === 0 && day < totalDays) {
            rowsHtml += '</tr><tr>';
          }
        }

        while (currentCellIndex % 7 !== 0) {
          rowsHtml += '<td class="empty-cell"></td>';
          currentCellIndex++;
        }
        rowsHtml += '</tr>';

        const prevMonth = month === 1 ? 12 : month - 1;
        const nextMonth = month === 12 ? 1 : month + 1;

        const tableRowsHtml = events.map(e => `

            <td><strong>${year}-${String(month).padStart(2, '0')}-${String(e.day).padStart(2, '0')}</strong></td>

            </td>
          </tr>
        `).join('');

        return `

                    <input type="text" class="form-input" value="2026 하반기 신규 수강생 모집 안내">

          `;
        } else if (section === 'calendar_manage') {

                  <div class="form-group">
                    <label class="form-label" for="set-company-name">상호명 (기관명)</label>

                    <label class="form-label" for="set-contact-email">대표 이메일</label>
                    <input type="email" id="set-contact-email" class="form-input" value="contact@domain.com">
                  </div>
                </div>
              </div>

              <!-- 2. Security Auth -->
              <div class="card-container">
                <div class="card-header">
                  <div class="card-title">관리자 보안 및 계정 관리</div>

                  <div class="form-group">
                    <label class="form-label" for="set-admin-id">최고 관리자 ID</label>
                    <input type="text" id="set-admin-id" class="form-input" value="${state.adminAuth?.adminId || 'admin'}">

                    <label class="form-label" for="set-admin-pw">관리자 비밀번호</label>

                </div>
              </div>
            </div>
          `;
        }

      function getStatusBadge(status) {
        switch (status) {
          case '접수대기':
            return `<span class="status-pill status-wait"><span class="status-dot"></span>접수대기</span>`;
          case '승인완료':
            return `<span class="status-pill status-approved"><span class="status-dot"></span>승인완료</span>`;
          case '참여완료':
            return `<span class="status-pill status-complete"><span class="status-dot"></span>참여완료</span>`;
          case '신청취소':
            return `<span class="status-pill status-cancelled"><span class="status-dot"></span>신청취소</span>`;
          case '대기자':
            return `<span class="status-pill status-rejected"><span class="status-dot"></span>대기자</span>`;
          case '신청반려':
            return `<span class="status-pill status-rejected"><span class="status-dot"></span>신청반려</span>`;
          default:
            return `<span class="status-pill status-wait"><span class="status-dot"></span>${status}</span>`;
        }
      }

      window.updateStatus = function(id, newStatus) {
        const applies = JSON.parse(localStorage.getItem(LOCAL_APPLIES_KEY) || '[]');
        const target = applies.find(a => a.id === id);
        if (target) {
          target.status = newStatus;
          localStorage.setItem(LOCAL_APPLIES_KEY, JSON.stringify(applies));
          showToast(`[${target.name}] 님의 접수 상태가 [${newStatus}] 로 변경되었습니다.`);
          renderSidebar();
          renderWorkspace(activeSection);
        }
      };

      window.saveSettings = function() {
        const siteTitle = document.getElementById('set-site-title')?.value.trim();
        const companyName = document.getElementById('set-company-name')?.value.trim();
        const adminId = document.getElementById('set-admin-id')?.value.trim();
        const adminPw = document.getElementById('set-admin-pw')?.value.trim();

        if (state.siteInfo) {
          state.siteInfo.siteTitle = siteTitle;
          state.siteInfo.companyName = companyName;
        }
        if (state.adminAuth) {
          state.adminAuth.adminId = adminId;
          state.adminAuth.adminPw = adminPw;
        }

        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {}

        document.getElementById('admin-site-title').textContent = siteTitle;
        document.getElementById('admin-display-name').textContent = `최고관리자 (${adminId})`;
        showToast('환경 설정이 성공적으로 저장되었습니다.');
      };

      window.showNewProgramModal = function() {

        root.innerHTML = `
          <div class="modal-overlay">

                <button class="btn btn-ghost btn-xs" onclick="document.getElementById('admin-modal-root').innerHTML=''">✕</button>
              </div>
              <form id="form-new-program" style="display:flex; flex-direction:column; gap:14px;">

                  <label class="form-label" for="prog-title">프로그램명 *</label>
                  <input type="text" id="prog-title" class="form-input" required value="2026 가을맞이 특별 바우처 프로그램">

                <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">

                    <label class="form-label" for="prog-quota">모집정원 (명)</label>
                    <input type="number" id="prog-quota" class="form-input" value="20">

                </div>
                <div class="form-group">

                  <input type="text" id="prog-period" class="form-input" value="2026-09-01 ~ 2026-09-15">
                </div>
                <div class="form-group">
                  <label class="form-label" for="prog-time">교육 일시</label>
                  <input type="text" id="prog-time" class="form-input" value="매주 화, 목 14:00 - 16:00">
                </div>
                <div class="modal-actions">
                  <button type="button" class="btn btn-secondary" onclick="document.getElementById('admin-modal-root').innerHTML=''">취소</button>
                  <button type="submit" class="btn btn-primary">개설 완료</button>
                </div>
              </form>
            </div>
          </div>

        document.getElementById('form-new-program').addEventListener('submit', (e) => {

          showToast('신규 프로그램이 성공적으로 개설되었습니다.');

      window.exportCSV = function() {
        showToast('신청자 명단 CSV 파일이 다운로드되었습니다.');

      initAdmin();
    })();
  </script>
