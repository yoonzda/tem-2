  <!-- Sub Page Controller Script -->
  <script>
    (function() {
      const STORAGE_KEY = 'WEB_BUILDER_STUDIO_STATE_V3';

      function getState() {
        if (window.opener && window.opener.builderStore && typeof window.opener.builderStore.getState === 'function') {
          return window.opener.builderStore.getState();
        }
        try {
          const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('WEB_BUILDER_STUDIO_STATE_V1');
          if (raw) return JSON.parse(raw);
        } catch (e) {
          console.warn('Storage parse error:', e);
        }
        return null;
      }

      function getUrlParams() {
        const params = new URLSearchParams(window.location.search);
        let cat = params.has('cat') ? parseInt(params.get('cat'), 10) : null;
        let sub = params.has('sub') ? parseInt(params.get('sub'), 10) : null;
        const menuId = params.get('menu') || '';
        const subId = params.get('subId') || '';

        // If URL has valid params, cache to sessionStorage
        if (cat !== null && !isNaN(cat)) {
          try {
            sessionStorage.setItem('BUILDER_SUBPAGE_TARGET', JSON.stringify({ cat, sub: (sub !== null && !isNaN(sub)) ? sub : 0 }));
          } catch (e) {}
        } else {
          // If URL params are missing (e.g. server cleanUrls redirect), fallback to sessionStorage
          try {
            const cached = sessionStorage.getItem('BUILDER_SUBPAGE_TARGET');
            if (cached) {
              const parsed = JSON.parse(cached);
              cat = parsed.cat;
              sub = parsed.sub;
            }
          } catch (e) {}
        }

        return {
          cat: (cat !== null && !isNaN(cat)) ? cat : 0,
          sub: (sub !== null && !isNaN(sub)) ? sub : 0,
          menuId,
          subId
        };
      }

      function renderTemplateSections(pageType, catName, subName, siteTitle, address, phone) {
        const container = document.getElementById('sub-body-container');
        if (!container) return;

        switch (pageType) {
          case 'history':
            if (window.HistoryEditor) {
              window.HistoryEditor.init(container);
            } else if (window.TemplateComponents) {
              container.innerHTML = window.TemplateComponents.history(siteTitle, subName);
            }
            if (typeof initTimelineScrollAnimation === 'function') {
              setTimeout(initTimelineScrollAnimation, 50);
            }
            break;

          case 'org':
          case 'organization':
            if (window.OrgEditor) {
              window.OrgEditor.init(container);
            } else if (window.TemplateComponents) {
              container.innerHTML = window.TemplateComponents.organization(siteTitle, subName);
            }
            break;

          case 'map':
            container.innerHTML = window.TemplateComponents ? window.TemplateComponents.location(address, phone) : '';
            break;

          case 'departments':
          case 'business':
          case 'service':
            container.innerHTML = window.TemplateComponents ? window.TemplateComponents.departments(subName) : '';
            break;

          case 'gallery':
            container.innerHTML = window.TemplateComponents ? window.TemplateComponents.gallery(subName) : '';
            // Initialize Slick Slider
            if (typeof slickSlide === 'function') {
              slickSlide();
            } else if ($.fn.slick) {
              $(".slideContent").slick({
                arrows: true,
                prevArrow: $('.prevButton'),
                nextArrow: $('.nextButton')
              });
            }
            break;

          case 'board':
            container.innerHTML = `
              <section class="sub-page-section">
                <div class="titleBox align-center color-black">
                  <mark>SEOUL MAEUM DENTAL CLINIC</mark>
                  <h2>
                    서울마음치과 <b>${subName || '게시판'}</b>
                  </h2>
                  <p>서울마음치과의 주요 소식과 안내사항을 신속하게 전해드립니다.</p>
                </div>
                <div class="layout-max layout-padding">
                  <div class="sub-board-search-bar" style="justify-content: flex-end;">
                    <form class="sub-board-search-form" onsubmit="event.preventDefault(); alert('검색 기능은 준비 중입니다.');">
                      <select class="sub-board-select">
                        <option value="title">제목</option>
                        <option value="content">내용</option>
                        <option value="writer">작성자</option>

                      <input type="text" class="sub-board-input">

                    </form>
                  </div>
                  <div class="sub-board-table-wrap">
                    <table class="sub-board-table">
                      <thead>
                        <tr>
                          <th style="width:80px;">번호</th>
                          <th>제목</th>
                          <th style="width:120px;">작성자</th>
                          <th style="width:120px;">작성일</th>
                          <th style="width:90px;">조회수</th>
                        </tr>
                      </thead>
                      <tbody>
                        <tr>
                          <td><span class="badge-notice">공지</span></td>
                          <td class="col-title"><a href="javascript:void(0)" onclick="alert('게시글 상세 화면은 준비 중입니다.')">서울마음치과 ${subName || '이용'} 안내 및 진료 시간 변경 공지</a></td>
                          <td>관리자</td>
                          <td>2026.08.20</td>
                          <td>1,420</td>
                        </tr>
                        <tr>
                          <td><span class="badge-notice">공지</span></td>
                          <td class="col-title"><a href="javascript:void(0)" onclick="alert('게시글 상세 화면은 준비 중입니다.')">2026년 하반기 주요 일정 및 예약 시스템 개선 안내</a></td>
                          <td>운영팀</td>
                          <td>2026.08.15</td>
                          <td>980</td>
                        </tr>
                        <tr>
                          <td>13</td>
                          <td class="col-title"><a href="javascript:void(0)" onclick="alert('게시글 상세 화면은 준비 중입니다.')">${subName || '진료'} 관련 자주 묻는 질문 및 상담 가이드</a></td>
                          <td>관리자</td>
                          <td>2026.08.10</td>
                          <td>432</td>
                        </tr>
                        <tr>
                          <td>12</td>
                          <td class="col-title"><a href="javascript:void(0)" onclick="alert('게시글 상세 화면은 준비 중입니다.')">첨단 디지털 진료 장비 도입 및 환자 편의성 향상 소식</a></td>
                          <td>진료팀</td>
                          <td>2026.08.05</td>
                          <td>610</td>
                        </tr>
                        <tr>
                          <td>11</td>
                          <td class="col-title"><a href="javascript:void(0)" onclick="alert('게시글 상세 화면은 준비 중입니다.')">정기 감염 관리 및 철저한 멸균 소독 완료 안내</a></td>
                          <td>운영팀</td>
                          <td>2026.07.28</td>
                          <td>290</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                  <div class="sub-pagination">
                    <button type="button" class="sub-page-btn material-symbols-outlined" style="font-size:18px;">chevron_left</button>
                    <button type="button" class="sub-page-btn active">1</button>
                    <button type="button" class="sub-page-btn">2</button>
                    <button type="button" class="sub-page-btn">3</button>
                    <button type="button" class="sub-page-btn material-symbols-outlined" style="font-size:18px;">chevron_right</button>
                  </div>
                </div>
              </section>
            `;
            break;

          case 'download':
            // Download items dataset (15 items)
            const DOWNLOAD_ITEMS = [
              { id: 1, title: '초진 환자 진료 사전 문진표 및 안내서', ext: 'PDF', size: '1.4 MB', date: '2026.08.20', cat: '서식/양식' },
              { id: 2, title: '치과 수술 및 마취 동의서 양식', ext: 'HWP', size: '420 KB', date: '2026.08.18', cat: '동의서/신청서' },
              { id: 3, title: '2026 임플란트 시술 후 주의사항 및 관리 매뉴얼', ext: 'PDF', size: '2.8 MB', date: '2026.08.15', cat: '진료안내' },
              { id: 4, title: '진료비 세부내역서 및 영수증 발급 신청서', ext: 'PDF', size: '580 KB', date: '2026.08.12', cat: '서식/양식' },
              { id: 5, title: '치아 교정 치료 단계별 안내서 및 체크리스트', ext: 'XLSX', size: '850 KB', date: '2026.08.10', cat: '진료안내' },
              { id: 6, title: '개인정보 수집·이용 및 제3자 제공 동의서', ext: 'HWP', size: '380 KB', date: '2026.08.05', cat: '동의서/신청서' },
              { id: 7, title: '진단서 및 소견서 발급 위임장 양식', ext: 'HWP', size: '490 KB', date: '2026.07.28', cat: '서식/양식' },
              { id: 8, title: '스케일링 및 잇몸 치료 후 홈케어 가이드북', ext: 'PDF', size: '3.5 MB', date: '2026.07.20', cat: '진료안내' },
              { id: 9, title: '원내 서식 및 환자용 각종 신청서 통합 압축본', ext: 'ZIP', size: '4.2 MB', date: '2026.07.15', cat: '서식/양식' },
              { id: 10, title: '미성년자 진료 및 처치 동의서 양식', ext: 'HWP', size: '310 KB', date: '2026.07.08', cat: '동의서/신청서' },
              { id: 11, title: '보철물(크라운/인레이) 장착 후 관리 안내문', ext: 'PDF', size: '1.9 MB', date: '2026.07.02', cat: '진료안내' },
              { id: 12, title: '보험 청구용 진료 확인서 및 통원 증명 서식', ext: 'PDF', size: '620 KB', date: '2026.06.25', cat: '서식/양식' },
              { id: 13, title: '수면마취/진정치료 전후 주의사항 안내문', ext: 'PDF', size: '1.1 MB', date: '2026.06.18', cat: '진료안내' },
              { id: 14, title: '진료기록 열람 및 사본발급 동의서·위임장', ext: 'HWP', size: '450 KB', date: '2026.06.10', cat: '동의서/신청서' },
              { id: 15, title: '턱관절 물리치료 및 운동요법 자가 가이드', ext: 'PDF', size: '2.3 MB', date: '2026.06.01', cat: '진료안내' }
            ];

            let currentPage = 1;
            const itemsPerPage = 9;
            let currentFilteredItems = [...DOWNLOAD_ITEMS];

            container.innerHTML = `
              <section class="sub-page-section">
                <div class="titleBox align-center color-black">
                  <mark>SEOUL MAEUM DENTAL CLINIC</mark>
                  <h2>
                    서울마음치과 <b>${subName || '자료실'}</b>
                  </h2>
                  <p>필요하신 서식 및 안내 자료를 클릭하시면 즉시 다운로드하실 수 있습니다.</p>
                </div>
                <div class="layout-max layout-padding">
                  <!-- Toolbar: Search Only (Right-aligned, Flat 0-Radius) -->
                  <div class="sub-download-toolbar">
                    <div class="sub-download-search-wrap">
                      <input type="text" class="sub-download-search-input" id="sub-download-keyword">
                      <button type="button" class="sub-download-search-btn" id="btn-sub-download-search">검색</button>
                    </div>
                  </div>

                  <!-- Card Grid (3 Columns, 9 items per page) -->
                  <div class="sub-download-grid" id="sub-download-card-list"></div>

                  <!-- Pagination (Only shown when totalPages > 1) -->
                  <div class="sub-pagination" id="sub-download-pagination-wrap" style="display:none;"></div>
                </div>
              </section>
              <div id="sub-download-toast" class="sub-download-toast">
                <span class="material-symbols-outlined" style="font-size:20px; color:#10B981;">check_circle</span>
                <span id="sub-download-toast-msg">다운로드가 시작되었습니다.</span>
              </div>
            `;

            // Automatic Download Trigger
            function triggerFileDownload(title, ext) {
              const fileName = `${title}.${ext.toLowerCase()}`;
              const blobContent = `[BUILDER STUDIO] ${title}\n\n서울마음치과 공식 자료실 다운로드 문서입니다.\n파일명: ${fileName}\n형식: ${ext}\n발행기관: 서울마음치과`;
              const blob = new Blob([blobContent], { type: 'text/plain;charset=utf-8' });
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = fileName;
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
              URL.revokeObjectURL(url);

              // Show Toast Notice
              const toast = document.getElementById('sub-download-toast');
              const toastMsg = document.getElementById('sub-download-toast-msg');
              if (toast && toastMsg) {
                toastMsg.textContent = `${fileName} 다운로드가 시작되었습니다.`;
                toast.classList.add('show');
                clearTimeout(window._dlToastTimer);
                window._dlToastTimer = setTimeout(() => {
                  toast.classList.remove('show');
                }, 2800);
              }
            }

            // Render Cards and Functional Pagination
            function renderCardsAndPagination() {
              const totalItems = currentFilteredItems.length;
              const totalPages = Math.ceil(totalItems / itemsPerPage);

              if (currentPage > totalPages && totalPages > 0) currentPage = totalPages;
              if (currentPage < 1) currentPage = 1;

              const startIndex = (currentPage - 1) * itemsPerPage;
              const pageItems = currentFilteredItems.slice(startIndex, startIndex + itemsPerPage);

              const gridEl = document.getElementById('sub-download-card-list');
              const paginationWrap = document.getElementById('sub-download-pagination-wrap');

              if (!gridEl) return;

              // 1. Render Cards
              if (pageItems.length === 0) {
                gridEl.innerHTML = `
                  <div style="grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: #9CA3AF; font-size: 15px; background: #FFF; border-radius: 12px; border: 1.5px dashed #E5E7EB;">
                    검색 조건에 일치하는 자료가 없습니다.
                  </div>
                `;
              } else {
                gridEl.innerHTML = pageItems.map(item => `
                  <div class="sub-download-box" data-cat="${item.cat}" data-title="${item.title}" data-ext="${item.ext}" data-size="${item.size}">
                    <div class="sub-download-box-header">
                      <span class="sub-download-category">${item.cat}</span>
                    </div>
                    <div class="sub-download-box-title">${item.title}</div>
                    <div class="sub-download-box-footer">
                      <div class="sub-download-meta-line">
                        <span class="sub-download-meta-ext">${item.ext}</span>
                        <span class="sub-download-meta-dot">·</span>
                        <span class="sub-download-meta-size">${item.size}</span>
                        <span class="sub-download-meta-dot">·</span>
                        <span class="sub-download-meta-date">${item.date}</span>
                      </div>
                    </div>
                    <!-- Hover Overlay: Centered Icon + Title -->
                    <div class="sub-download-hover-overlay">
                      <div class="sub-download-hover-circle">
                        <span class="material-symbols-outlined sub-download-hover-icon">download</span>
                      </div>
                      <div class="sub-download-hover-title">${item.title}</div>
                    </div>
                  </div>
                `).join('');

                // Bind Card Click (Entire box is clickable)
                $(gridEl).find('.sub-download-box').on('click', function() {
                  const title = $(this).attr('data-title');
                  const ext = $(this).attr('data-ext');
                  triggerFileDownload(title, ext);
                });
              }

              // 2. Render Pagination: ONLY IF totalPages > 1
              if (!paginationWrap) return;

              if (totalPages <= 1) {
                paginationWrap.innerHTML = '';
                paginationWrap.style.display = 'none';
              } else {
                paginationWrap.style.display = 'flex';
                let pageBtnsHtml = '';

                // Prev Button
                const isPrevDisabled = (currentPage === 1);
                pageBtnsHtml += `
                  <button type="button" class="sub-page-btn material-symbols-outlined btn-page-prev ${isPrevDisabled ? 'disabled' : ''}" style="font-size:18px;" ${isPrevDisabled ? 'disabled' : ''}>chevron_left</button>
                `;

                // Page Number Buttons
                for (let p = 1; p <= totalPages; p++) {
                  const isActive = (p === currentPage);
                  pageBtnsHtml += `
                    <button type="button" class="sub-page-btn btn-page-num ${isActive ? 'active' : ''}" data-page="${p}">${p}</button>

                { id: `ev-fb-${monthKey}-2`, day: 15, title: `${month}월 주요 사업 추진 세미나`, tag: '주요 행사', color: 'amber', time: '14:00 ~ 17:00', loc: '컨퍼런스홀', desc: '사업부문별 주요 실적 점검 및 협력사 파트너십 강화 세미나입니다.' },
                { id: `ev-fb-${monthKey}-3`, day: 25, title: '정기 인프라 및 전산 보안 점검', tag: '시스템 점검', color: 'green', time: '22:00 ~ 익일 04:00', loc: '전산 시스템 센터', desc: '안정적인 서비스 운영을 위한 서버 정기 점검 및 보안 패치 작업입니다.' }
              ];
            }

            function buildCalendarGrid(year, month, events) {
              const firstDayOfWeek = new Date(year, month - 1, 1).getDay();
              const totalDays = new Date(year, month, 0).getDate();
              const prevTotalDays = new Date(year, month - 1, 0).getDate();

              const dayEventsMap = {};
              for (let d = 1; d <= totalDays; d++) {
                dayEventsMap[d] = [];
              }
              const nextMonthEventsMap = {};

              events.forEach(ev => {
                if (ev.endMonth && ev.endMonth > month) {
                  // 다음 달로 이어지는 일정 (예: 9월 28일 ~ 10월 2일)
                  const startDay = ev.day;
                  for (let d = startDay; d <= totalDays; d++) {
                    let rType = (d === startDay) ? 'start' : 'mid';
                    dayEventsMap[d].push({ ev, type: rType, crossNext: true });
                  }
                  // 다음 달 잔여 일수 칸(1, 2, ... ev.endDay)
                  for (let nd = 1; nd <= ev.endDay; nd++) {
                    if (!nextMonthEventsMap[nd]) nextMonthEventsMap[nd] = [];
                    let rType = (nd === ev.endDay) ? 'end' : 'mid';
                    nextMonthEventsMap[nd].push({ ev, type: rType, isNextMonthDim: true });
                  }
                } else if (ev.isCrossContinuation) {
                  // 이전 달에서 넘어온 일정 (10월 화면의 10월 1일~2일)
                  for (let d = 1; d <= ev.endDay; d++) {
                    let rType = (d === 1) ? 'cont-start' : (d === ev.endDay ? 'end' : 'mid');
                    dayEventsMap[d].push({ ev, type: rType, continued: true });
                  }
                } else {
                  // 일반 연속 또는 단일 일정
                  const startDay = ev.day;
                  const endDay = ev.endDay || ev.day;
                  if (startDay === endDay) {
                    if (dayEventsMap[startDay]) {
                      dayEventsMap[startDay].push({ ev, type: 'single' });
                    }
                  } else {
                    for (let d = startDay; d <= endDay; d++) {
                      if (dayEventsMap[d]) {
                        let rType = 'mid';
                        if (d === startDay) rType = 'start';
                        else if (d === endDay) rType = 'end';
                        dayEventsMap[d].push({ ev, type: rType });
                      }
                    }
                  }
                }
              });

              let rowsHtml = '';
              let currentCellIndex = 0;
              let currentRowHtml = '<tr>';

              // 이전 달 잔여 일수
              for (let i = 0; i < firstDayOfWeek; i++) {
                const prevDayNum = prevTotalDays - firstDayOfWeek + 1 + i;
                const isSun = i === 0;
                currentRowHtml += `<td class="dim"><div class="sub-cal-day-top"><span class="sub-cal-day-num ${isSun ? 'sun' : ''}">${prevDayNum}</span></div></td>`;
                currentCellIndex++;
              }

              // 현재 월 일수
              for (let day = 1; day <= totalDays; day++) {
                const dayOfWeek = (firstDayOfWeek + day - 1) % 7;
                const isSun = dayOfWeek === 0;
                const isSat = dayOfWeek === 6;
                const isToday = (year === 2026 && month === 9 && day === 16);

                const dayItems = dayEventsMap[day] || [];
                let pillsHtml = '';

                dayItems.forEach(item => {
                  const ev = item.ev;
                  const rType = item.type;
                  let ribbonClass = '';
                  let displayText = ev.title;

                  if (rType === 'start') {
                    ribbonClass = 'cal-pill-start';
                  } else if (rType === 'cont-start') {
                    ribbonClass = 'cal-pill-cont-start';
                    displayText = ev.title;
                  } else if (rType === 'mid') {
                    ribbonClass = 'cal-pill-mid';
                    displayText = '&nbsp;';
                  } else if (rType === 'end') {
                    ribbonClass = 'cal-pill-end';
                    displayText = '&nbsp;';
                  }

                  let periodText = '';
                  if (ev.endMonth && ev.endMonth !== month) {
                    periodText = `${year}.${String(month).padStart(2,'0')}.${String(ev.day).padStart(2,'0')} ~ ${String(ev.endMonth).padStart(2,'0')}.${String(ev.endDay).padStart(2,'0')} (5일간)`;
                  } else if (ev.startMonth && ev.startMonth !== month) {
                    periodText = `${year}.${String(ev.startMonth).padStart(2,'0')}.${String(ev.startDay).padStart(2,'0')} ~ ${String(month).padStart(2,'0')}.${String(ev.endDay).padStart(2,'0')} (5일간)`;
                  } else if (ev.endDay && ev.endDay !== ev.day) {
                    periodText = `${year}.${String(month).padStart(2,'0')}.${String(ev.day).padStart(2,'0')} ~ ${String(ev.endDay).padStart(2,'0')} (${ev.endDay - ev.day + 1}일간)`;
                  } else {
                    periodText = `${year}.${String(month).padStart(2,'0')}.${String(ev.day).padStart(2,'0')}`;
                  }

                  pillsHtml += `
                    <span class="sub-cal-event-pill ${ev.color} ${ribbonClass}"
                          data-event-id="${ev.id}"
                          data-title="${ev.title}"
                          data-tag="${ev.tag}"
                          data-color="${ev.color}"
                          data-period="${periodText}"
                          data-time="${ev.time}"
                          data-loc="${ev.loc}"
                          data-desc="${ev.desc}">
                      ${displayText}
                    </span>
                  `;
                });

                const numClass = isToday ? 'today-badge' : (isSun ? 'sun' : (isSat ? 'sat' : ''));
                const cellClass = isToday ? 'is-today' : '';

                currentRowHtml += `
                  <td class="${cellClass}">
                    <div class="sub-cal-day-top">
                      <span class="sub-cal-day-num ${numClass}">${day}</span>
                    </div>
                    ${pillsHtml}
                  </td>
                `;
                currentCellIndex++;

                if (currentCellIndex % 7 === 0 && day < totalDays) {
                  currentRowHtml += '</tr>';
                  rowsHtml += currentRowHtml;
                  currentRowHtml = '<tr>';
                }
              }

              // 다음 달 잔여 일수
              let nextMonthDay = 1;
              while (currentCellIndex % 7 !== 0) {
                const dayOfWeek = currentCellIndex % 7;
                const isSat = dayOfWeek === 6;
                const nextItems = nextMonthEventsMap[nextMonthDay] || [];
                let nextPillsHtml = '';

                nextItems.forEach(item => {
                  const ev = item.ev;
                  const rType = item.type;
                  let ribbonClass = (rType === 'end') ? 'cal-pill-end' : 'cal-pill-mid';
                  let displayText = '&nbsp;';
                  const endMonthPad = String(ev.endMonth).padStart(2, '0');
                  const endDayPad = String(ev.endDay).padStart(2, '0');
                  const periodText = `${year}.${String(month).padStart(2,'0')}.${String(ev.day).padStart(2,'0')} ~ ${endMonthPad}.${endDayPad} (5일간)`;

                  nextPillsHtml += `
                    <span class="sub-cal-event-pill ${ev.color} ${ribbonClass} dim-pill"
                          data-event-id="${ev.id}"
                          data-title="${ev.title}"
                          data-tag="${ev.tag}"
                          data-color="${ev.color}"
                          data-period="${periodText}"
                          data-time="${ev.time}"
                          data-loc="${ev.loc}"
                          data-desc="${ev.desc}">
                      ${displayText}
                    </span>
                  `;
                });

                currentRowHtml += `
                  <td class="dim">
                    <div class="sub-cal-day-top">
                      <span class="sub-cal-day-num ${isSat ? 'sat' : ''}">${nextMonthDay}</span>
                    </div>
                    ${nextPillsHtml}
                  </td>
                `;
                nextMonthDay++;
                currentCellIndex++;
              }
              currentRowHtml += '</tr>';
              rowsHtml += currentRowHtml;

              return rowsHtml;
            }

            function buildMobileAccordionList(year, month, events) {
              if (!events || events.length === 0) {
                return `<div class="sub-cal-mobile-empty">해당 월에 등록된 일정이 없습니다.</div>`;
              }

              const daysOfWeekKo = ['일', '월', '화', '수', '목', '금', '토'];

              // 연속 일정 중복 제거하여 단 1개의 통합 카드로 생성
              const uniqueEvents = [];
              const seenIds = new Set();
              events.forEach(ev => {
                if (!seenIds.has(ev.id)) {
                  seenIds.add(ev.id);
                  uniqueEvents.push(ev);
                }
              });

              uniqueEvents.sort((a, b) => a.day - b.day);

              return uniqueEvents.map(ev => {
                const startDate = new Date(year, month - 1, ev.day);
                const startDayKo = daysOfWeekKo[startDate.getDay()];
                let dateHtml = `${String(month).padStart(2, '0')}.${String(ev.day).padStart(2, '0')} <span class="sub-cal-accordion-day">${startDayKo}</span>`;

                if (ev.endMonth && ev.endMonth !== month) {
                  const endDate = new Date(year, ev.endMonth - 1, ev.endDay);
                  const endDayKo = daysOfWeekKo[endDate.getDay()];
                  dateHtml = `${String(month).padStart(2, '0')}.${String(ev.day).padStart(2, '0')} <span class="sub-cal-accordion-day">${startDayKo}</span> - ${String(ev.endMonth).padStart(2, '0')}.${String(ev.endDay).padStart(2, '0')} <span class="sub-cal-accordion-day">${endDayKo}</span>`;
                } else if (ev.startMonth && ev.startMonth !== month) {
                  const realStartDate = new Date(year, ev.startMonth - 1, ev.startDay);
                  const realStartDayKo = daysOfWeekKo[realStartDate.getDay()];
                  const endDate = new Date(year, month - 1, ev.endDay);
                  const endDayKo = daysOfWeekKo[endDate.getDay()];
                  dateHtml = `${String(ev.startMonth).padStart(2, '0')}.${String(ev.startDay).padStart(2, '0')} <span class="sub-cal-accordion-day">${realStartDayKo}</span> - ${String(month).padStart(2, '0')}.${String(ev.endDay).padStart(2, '0')} <span class="sub-cal-accordion-day">${endDayKo}</span>`;
                } else if (ev.endDay && ev.endDay !== ev.day) {
                  const endDate = new Date(year, month - 1, ev.endDay);
                  const endDayKo = daysOfWeekKo[endDate.getDay()];
                  dateHtml = `${String(month).padStart(2, '0')}.${String(ev.day).padStart(2, '0')} <span class="sub-cal-accordion-day">${startDayKo}</span> - ${String(month).padStart(2, '0')}.${String(ev.endDay).padStart(2, '0')} <span class="sub-cal-accordion-day">${endDayKo}</span>`;
                }

                return `
                  <div class="sub-cal-accordion-item">
                    <button type="button" class="sub-cal-accordion-trigger">
                      <div class="sub-cal-accordion-info">
                        <span class="sub-cal-accordion-date">${dateHtml}</span>
                        <span class="sub-cal-accordion-title">${ev.title}</span>
                      </div>
                      <span class="sub-cal-accordion-icon material-symbols-outlined">expand_more</span>
                    </button>
                    <div class="sub-cal-accordion-body">
                      <div class="sub-cal-accordion-inner">
                        <div class="sub-cal-accordion-meta">
                          <div class="sub-cal-accordion-row">
                            <span class="material-symbols-outlined">schedule</span>
                            <span>${ev.time}</span>
                          </div>
                          <div class="sub-cal-accordion-row">
                            <span class="material-symbols-outlined">location_on</span>
                            <span>${ev.loc}</span>
                          </div>
                          ${ev.desc ? `<p class="sub-cal-accordion-desc">${ev.desc}</p>` : ''}
                          <div class="sub-cal-accordion-actions">
                            <button type="button" class="sub-cal-accordion-detail-btn" onclick="alert('일정 상세 안내 페이지로 이동합니다.')">
                              <span>자세히보기</span>
                              <span class="material-symbols-outlined">arrow_forward</span>
                            </button>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                `;
              }).join('');
            }

            const companyDisplay = siteTitle || '서울마음치과';
            const pageSubTitle = subName || '월간 일정';

            container.innerHTML = `
              <section class="sub-page-section">
                <div class="layout-max layout-padding">
                  <div class="titleBox align-center color-black">
                    <mark>${siteTitle || 'SEOUL MAEUM DENTAL CLINIC'}</mark>
                    <h2>
                      ${companyDisplay} <b>${pageSubTitle}</b>
                    </h2>
                    <p>주요 업무 일정과 월간 행사 안내 사항을 확인하실 수 있습니다.</p>
                  </div>
                  <div id="sub-cal-root" class="sub-cal-wrap"></div>
                </div>
              </section>
            `;

            // 호버 툴팁 싱글톤 인스턴스
            let $tooltip = $('#cal-event-tooltip');
            if (!$tooltip.length) {
              $tooltip = $('<div id="cal-event-tooltip"></div>').appendTo('body');
            } else if ($tooltip.parent()[0] !== document.body) {
              $tooltip.appendTo('body');
            }

            let hideTimeout = null;
            let currentActiveEventId = null;

            function positionTooltip(targetEl) {
              const rect = targetEl.getBoundingClientRect();
              const ttWidth = $tooltip.outerWidth();
              const ttHeight = $tooltip.outerHeight();

              let left = rect.left + (rect.width / 2) - (ttWidth / 2);
              let top = rect.top - ttHeight - 10;

              if (left < 16) left = 16;
              if (left + ttWidth > $(window).width() - 16) {
                left = $(window).width() - ttWidth - 16;
              }

              if (top < 16) {
                top = rect.bottom + 10;
              }

              $tooltip.css({
                left: Math.round(left) + 'px',
                top: Math.round(top) + 'px'
              });
            }

            function showTooltip(targetEl) {
              if (hideTimeout) {
                clearTimeout(hideTimeout);
                hideTimeout = null;
              }

              const $el = $(targetEl);
              const eventId = $el.attr('data-event-id');

              // 연속 일정 리본 간 이동 시 툴팁 깜빡임/재오픈 방지
              if (eventId && eventId === currentActiveEventId && $tooltip.hasClass('is-visible')) {
                return;
              }
              currentActiveEventId = eventId;

              const title = $el.attr('data-title') || $el.text().trim();
              const tag = $el.attr('data-tag') || '일정';
              const color = $el.attr('data-color') || 'blue';
              const period = $el.attr('data-period') || '';
              const time = $el.attr('data-time') || '시간 미정';
              const loc = $el.attr('data-loc') || '장소 미정';
              const desc = $el.attr('data-desc') || '';

              $tooltip.html(`
                <div class="cal-tooltip-header">
                  <div class="cal-tooltip-category">
                    <span class="cal-tooltip-dot tag-${color}"></span>
                    <span class="cal-tooltip-category-name">${tag}</span>
                  </div>
                  <h4 class="cal-tooltip-title">${title}</h4>
                </div>
                <div class="cal-tooltip-body">
                  ${period ? `
                  <div class="cal-tooltip-row">
                    <span class="material-symbols-outlined">calendar_today</span>
                    <span style="font-weight:600;">${period}</span>
                  </div>` : ''}
                  <div class="cal-tooltip-row">
                    <span class="material-symbols-outlined">schedule</span>
                    <span>${time}</span>
                  </div>
                  <div class="cal-tooltip-row">
                    <span class="material-symbols-outlined">location_on</span>
                    <span>${loc}</span>
                  </div>
                  ${desc ? `<p class="cal-tooltip-desc">${desc}</p>` : ''}
                </div>
                <div class="cal-tooltip-actions">
                  <button type="button" class="cal-tooltip-btn primary" onclick="alert('일정 상세 안내 페이지로 이동합니다.')">
                    <span>자세히보기</span>
                    <span class="material-symbols-outlined">arrow_forward</span>
                  </button>
                </div>
              `).addClass('is-visible');

              positionTooltip(targetEl);
            }

            function scheduleHide() {
              if (hideTimeout) clearTimeout(hideTimeout);
              hideTimeout = setTimeout(function() {
                $tooltip.removeClass('is-visible');
                currentActiveEventId = null;
              }, 220);
            }

            function bindTooltipEvents() {
              $('#sub-cal-root').find('.sub-cal-event-pill')
                .off('mouseenter mouseleave')
                .on('mouseenter', function() {
                  showTooltip(this);
                }).on('mouseleave', function() {
                  scheduleHide();
                });
            }

            $tooltip.off('mouseenter mouseleave')
              .on('mouseenter', function() {
                if (hideTimeout) {
                  clearTimeout(hideTimeout);
                  hideTimeout = null;
                }
              }).on('mouseleave', function() {
                scheduleHide();
              });

            function renderCalendarView() {
              const year = window.subCalYear;
              const month = window.subCalMonth;
              const monthFormatted = `${year}.${String(month).padStart(2, '0')}`;
              const events = getMonthEvents(year, month);
              const gridRowsHtml = buildCalendarGrid(year, month, events);
              const mobileListHtml = buildMobileAccordionList(year, month, events);

              const $root = $('#sub-cal-root');
              $root.html(`
                <div class="sub-cal-header">
                  <div class="sub-cal-month-center">
                    <button type="button" class="sub-cal-btn-nav material-symbols-outlined" onclick="window.navigateSubCalendar(-1)">chevron_left</button>

                <!-- 모바일 전용 일정 목록 (아코디언 상세 보기) -->

              `);

              // 모바일 아코디언 인터랙션 바인딩 (순수 CSS Grid 0fr -> 1fr 하드웨어 가속 트랜지션)

            window.navigateSubCalendar = function(direction) {
              window.subCalMonth += direction;

                window.subCalMonth = 1;
                window.subCalYear += 1;
              }
              renderCalendarView();

            // 최초 달력 뷰 렌더링

            break;

          case 'faq':

        }

        // Attach GSAP Smooth Curtain Motion to newly rendered components
        if (typeof initGsapCurtainMotion === 'function') {
          setTimeout(initGsapCurtainMotion, 50);
        }
      }

      function applySubPageState() {
        let state = getState();
        if (!state) {
          state = {
            siteInfo: { siteTitle: '서울마음치과', companyName: '서울마음치과' },

              { id: 'm1', name: '회사소개', submenus: [{ id: 's1_1', name: '인사말' }, { id: 's1_2', name: '연혁' }, { id: 's1_3', name: '조직도' }, { id: 's1_4', name: '오시는길' }] },
              { id: 'm2', name: '사업분야', submenus: [{ id: 's2_1', name: '주요사업' }, { id: 's2_2', name: '솔루션' }, { id: 's2_3', name: '갤러리' }] },
              { id: 'm3', name: '홍보센터', submenus: [{ id: 's3_1', name: '공지사항' }, { id: 's3_2', name: '월간 일정' }, { id: 's3_3', name: '자료실' }] },
              { id: 'm4', name: '고객지원', submenus: [{ id: 's4_1', name: '온라인 문의' }, { id: 's4_2', name: '자주 묻는 질문' }] }
            ],
            pageOptions: {
              's3_2': { type: 'calendar' },
              's3_3': { type: 'download' }
            }
          };
        }

        const siteTitle = state.siteInfo?.siteTitle || 'MY WEBSITE';
        const companyName = state.siteInfo?.companyName || siteTitle;
        const companyNameEn = state.siteInfo?.companyNameEn || (state.siteInfo?.siteTitle || 'MY COMPANY INC.');
        const ownerName = state.siteInfo?.ownerName || '대표자명';
        const address = state.siteInfo?.address || '서울특별시 강남구 테헤란로 123, 4층';
        const phone = state.siteInfo?.phone || '02-1234-5678';
        const bizNum = state.siteInfo?.bizNum || '123-45-67890';
        const menus = state.menus || [];
        const pageOptions = state.pageOptions || {};

        const { cat: catIdx, sub: subIdx } = getUrlParams();

        const currentCat = menus[catIdx] || menus[0] || { name: '회사소개', id: 'm1', submenus: [] };
        const currentCatName = currentCat.name || '회사소개';
        const subList = currentCat.submenus || [];
        const currentSub = subList[subIdx] || subList[0] || { name: currentCatName, id: currentCat.id };
        const currentSubName = currentSub.name || currentCatName;
        const currentMenuId = currentSub.id || currentCat.id;

        // Determine Page Type from pageOptions or intelligent fallback
        let pageType = pageOptions[currentMenuId]?.type || pageOptions[currentSub.id]?.type;
        const subLower = currentSubName.toLowerCase();

        // If pageType is unset or was previously saved as generic 'board' for download/archive menus, upgrade to 'download'
        if ((!pageType || pageType === 'board') && (subLower.includes('자료') || subLower.includes('다운로드') || subLower.includes('서식') || subLower.includes('양식') || subLower.includes('download'))) {
          pageType = 'download';
        }

        if (!pageType) {
          if (subLower.includes('연혁') || subLower.includes('발자취') || subLower.includes('히스토리') || subLower.includes('history')) pageType = 'history';
          else if (subLower.includes('조직도') || subLower.includes('임직원') || subLower.includes('구성원') || subLower.includes('조직') || subLower.includes('org') || subLower.includes('member')) pageType = 'org';
          else if (subLower.includes('오시는길') || subLower.includes('오시는 길') || subLower.includes('지도') || subLower.includes('위치') || subLower.includes('진료시간') || subLower.includes('location') || subLower.includes('map')) pageType = 'map';
          else if (subLower.includes('진료과목') || subLower.includes('사업') || subLower.includes('솔루션') || subLower.includes('서비스') || subLower.includes('주요사업') || subLower.includes('departments') || subLower.includes('business')) pageType = 'departments';
          else if (subLower.includes('갤러리') || subLower.includes('사진') || subLower.includes('둘러보기') || subLower.includes('gallery')) pageType = 'gallery';
          else if (subLower.includes('자료') || subLower.includes('다운로드') || subLower.includes('서식') || subLower.includes('양식') || subLower.includes('download')) pageType = 'download';
          else if (subLower.includes('공지') || subLower.includes('게시판') || subLower.includes('소식') || subLower.includes('보도') || subLower.includes('board')) pageType = 'board';
          else if (subLower.includes('일정') || subLower.includes('캘린더') || subLower.includes('행사') || subLower.includes('calendar')) pageType = 'calendar';
          else if (subLower.includes('문의') || subLower.includes('상담') || subLower.includes('신청') || subLower.includes('예약') || subLower.includes('contact')) pageType = 'contact';
          else if (subLower.includes('faq') || subLower.includes('자주') || subLower.includes('질문')) pageType = 'faq';
          else pageType = 'about';
        }

        // 1. Page Title & Meta (항상 사이트명으로 유지)
        document.title = siteTitle;

        const logoImg = document.getElementById('header-logo-img');
        if (logoImg) logoImg.alt = siteTitle;

        // 2. Breadcrumbs (홈 아이콘 + 대메뉴명)
        const bcCat = document.getElementById('bc-cat-name');
        if (bcCat) bcCat.textContent = currentCatName;

        // 3. Sub Visual Title & Description (각 하위 메뉴명 노출)
        const markTitle = document.getElementById('sub-page-title-mark');
        const pageDesc = document.getElementById('sub-page-desc');

        if (markTitle) {
          markTitle.textContent = currentSubName;
        }

        const customDesc = state.subPageDescriptions?.[currentMenuId] || pageOptions[currentMenuId]?.desc;
        const defaultDesc = `${currentSubName} 페이지에 들어갈 문구를 입력해주세요.`;

        if (pageDesc) {
          pageDesc.textContent = customDesc || defaultDesc;
          pageDesc.title = '수정하기';

          // 사용자가 미리보기에서 직접 수정한 문구를 실시간 저장
          pageDesc.onblur = function() {
            const updatedText = this.textContent.trim();
            const curState = getState() || {};
            if (!curState.subPageDescriptions) curState.subPageDescriptions = {};
            curState.subPageDescriptions[currentMenuId] = updatedText;

            try {
              localStorage.setItem(STORAGE_KEY, JSON.stringify(curState));
              if (window.opener && window.opener.builderStore) {
                window.opener.builderStore.updateState({ subPageDescriptions: curState.subPageDescriptions });
              }
            } catch (err) {
              console.warn('Desc save error:', err);
            }
          };
        }

        // 4. 대메뉴별 서브 비주얼 배경 이미지 일원화 (확정된 4종 1:1 매핑)
        const CATEGORY_BACKGROUNDS = {
          0: 'https://images.unsplash.com/photo-1455390582262-044cdead277a?auto=format&fit=crop&w=2000&q=80', // 대메뉴 1: 회사 소개 (만년필과 가죽 노트)
          1: 'https://images.unsplash.com/photo-1497633762265-9d179a990aa6?auto=format&fit=crop&w=2000&q=80', // 대메뉴 2: 사업 분야 (정돈된 북 & 오브제)
          2: 'https://images.unsplash.com/photo-1497215728101-856f4ea42174?auto=format&fit=crop&w=2000&q=80', // 대메뉴 3: 홍보 센터 (쾌적한 오피스 데스크 & 통창 자연광)
          3: 'https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=2000&q=80'  // 대메뉴 4: 고객 지원 (광활한 모던 비즈니스 라운지)
        };

        const bgUrl = CATEGORY_BACKGROUNDS[catIdx] || CATEGORY_BACKGROUNDS[0];
        const bgLayer = document.getElementById('sub-bg-layer');
        if (bgLayer) {
          bgLayer.style.backgroundImage = `url("${bgUrl}")`;
        }
        const homeSection = document.getElementById('home');
        if (homeSection) {
          homeSection.style.backgroundImage = `url("${bgUrl}")`;
        }

        // 5. Render Body Content with Template Modules
        renderTemplateSections(pageType, currentCatName, currentSubName, companyName, address, phone);

        // 5. Desktop GNB Main Bar & Single Persistent Sub-Bar
        const desktopList = document.getElementById('desktop-gnb-list');
        const subBarContent = document.getElementById('desktop-sub-bar-content');
        const $subBar = $('#desktop-sub-bar');
        const $header = $('header');

        if (desktopList && subBarContent) {
          const subBarMap = {};
          menus.forEach((cat, idx) => {
            if (cat.submenus && cat.submenus.length > 0) {
              subBarMap[idx] = `
                <ul class="sub-bar-list">
                  ${cat.submenus.map((sub, sIdx) => {
                    const subUrl = `sub_page.html?cat=${idx}&sub=${sIdx}`;
                    const isSubActive = (idx === catIdx && sIdx === subIdx);
                    return `<li><a href="${subUrl}" class="${isSubActive ? 'active' : ''}" data-cat="${idx}" data-sub="${sIdx}">${sub.name}</a></li>`;
                  }).join('')}
                </ul>
              `;
            } else {
              subBarMap[idx] = '';
            }
          });

          // Render Desktop GNB
          desktopList.innerHTML = menus.map((cat, idx) => {
            const mainUrl = `sub_page.html?cat=${idx}&sub=0`;
            const name = cat.name || `메뉴 ${idx + 1}`;
            const isCatActive = (idx === catIdx);
            return `
              <li class="gnb-nav-li ${isCatActive ? 'current-page' : ''}" data-idx="${idx}">
                <a href="${mainUrl}" data-cat="${idx}" data-sub="0">${name}</a>
              </li>
            `;
          }).join('');

          // Click handler for desktop & sub-bar links
          $(desktopList).find('a').on('click', function() {
            const cat = parseInt($(this).attr('data-cat') || '0', 10);
            const sub = parseInt($(this).attr('data-sub') || '0', 10);
            try {
              sessionStorage.setItem('BUILDER_SUBPAGE_TARGET', JSON.stringify({ cat, sub }));
            } catch (e) {}
          });

          $subBar.on('click', 'a', function() {
            const cat = parseInt($(this).attr('data-cat') || '0', 10);
            const sub = parseInt($(this).attr('data-sub') || '0', 10);
            try {
              sessionStorage.setItem('BUILDER_SUBPAGE_TARGET', JSON.stringify({ cat, sub }));
            } catch (e) {}
          });

          let hideTimer = null;

          function showSubBar(idx) {
            if (hideTimer) clearTimeout(hideTimer);
            const html = subBarMap[idx];
            if (html) {
              subBarContent.innerHTML = html;
              $header.addClass('sub-open menu-hovered');
              $subBar.addClass('open');
              $(desktopList).find('.gnb-nav-li').removeClass('active-menu');
              $(desktopList).find(`.gnb-nav-li[data-idx="${idx}"]`).addClass('active-menu');
            } else {
              hideSubBarImmediately();
            }
          }

          function hideSubBarImmediately() {
            if (hideTimer) clearTimeout(hideTimer);
            $header.removeClass('sub-open menu-hovered');
            $subBar.removeClass('open');
            $(desktopList).find('.gnb-nav-li').removeClass('active-menu');
          }

          function scheduleHideSubBar() {
            if (hideTimer) clearTimeout(hideTimer);
            hideTimer = setTimeout(function() {
              hideSubBarImmediately();
            }, 200);
          }

          $(desktopList).find('.gnb-nav-li').on('mouseenter', function() {
            const idx = parseInt($(this).attr('data-idx'), 10);
            showSubBar(idx);
          });

          $subBar.on('mouseenter', function() {
            if (hideTimer) clearTimeout(hideTimer);
          }).on('mouseleave', function() {
            scheduleHideSubBar();
          });

          $header.off('mouseleave.gnb mouseenter.gnb').on('mouseleave.gnb', function() {
            scheduleHideSubBar();
          }).on('mouseenter.gnb', function() {
            if (hideTimer) clearTimeout(hideTimer);
          });
        }

        // 6. Mobile Menu Panel
        const mobileList = document.getElementById('mobile-gnb-list');
        if (mobileList) {
          mobileList.innerHTML = menus.map((cat, cIdx) => {
            const mainUrl = `sub_page.html?cat=${cIdx}&sub=0`;
            const catName = cat.name || `메뉴 ${cIdx + 1}`;
            const hasSub = cat.submenus && cat.submenus.length > 0;
            const isCurrentCat = (cIdx === catIdx);

            const subHtml = hasSub
              ? `
                <ul class="panel-sub-list">
                  ${cat.submenus.map((sub, sIdx) => {
                    const subUrl = `sub_page.html?cat=${cIdx}&sub=${sIdx}`;
                    const isSubCurrent = (cIdx === catIdx && sIdx === subIdx);
                    return `
                      <li><a href="${subUrl}" class="panel-sub-link ${isSubCurrent ? 'active' : ''}" style="${isSubCurrent ? 'color:#FBA518; font-weight:700;' : ''}">${sub.name}</a></li>
                    `;
                  }).join('')}
                </ul>
              `
              : '';

            return `
              <li class="panel-menu-item ${isCurrentCat ? 'open' : ''}" data-cat-idx="${cIdx}">
                <div class="panel-item-header">
                  <span class="panel-main-title" style="${isCurrentCat ? 'color:#FBA518;' : ''}">${catName}</span>
                  ${hasSub ? `
                    <button type="button" class="panel-sub-btn material-symbols-outlined" aria-label="${catName} 하위메뉴 열기">
                      expand_more
                    </button>
                  ` : `
                    <a href="${mainUrl}" style="text-decoration:none; color:inherit; display:flex; align-items:center;">
                      <span class="material-symbols-outlined" style="font-size:24px; color:#999;">chevron_right</span>
                    </a>
                  `}
                </div>
                ${subHtml}
              </li>
            `;
          }).join('');

          $(mobileList).find('.panel-item-header').off('click').on('click', function(e) {
            const $item = $(this).closest('.panel-menu-item');
            const hasSub = $item.find('.panel-sub-list').length > 0;
            if (hasSub) {
              e.preventDefault();
              e.stopPropagation();
              $item.toggleClass('open');
            }
          });

          $(mobileList).find('.panel-sub-link').off('click').on('click', function() {
            if (typeof activeRemove === 'function') {
              activeRemove("#menuPanel", "active");
            } else {
              $("#menuPanel").removeClass("active");
            }
          });
        }

        // 7. Footer Info
        const footerBrand = document.getElementById('footer-brand-name');
        if (footerBrand) footerBrand.textContent = companyName;

        const footerAddress = document.getElementById('footer-address');
        if (footerAddress) footerAddress.textContent = address;

        const footerOwner = document.getElementById('footer-owner');
        if (footerOwner) footerOwner.textContent = '대표 : ' + ownerName;

        const footerPhoneLink = document.getElementById('footer-phone-link');
        if (footerPhoneLink) {
          footerPhoneLink.textContent = phone;
          footerPhoneLink.href = 'tel:' + phone.replace(/[^0-9]/g, '');
        }

        const footerBizNum = document.getElementById('footer-biznum');
        if (footerBizNum) footerBizNum.textContent = '사업자등록번호 : ' + bizNum;

        const footerCopy = document.getElementById('footer-copyright');
        if (footerCopy) footerCopy.textContent = `Copyright © ${companyNameEn} ALL RIGHTS RESERVED`;
      }

      // Global Continuous Smooth Scroll (Lenis + GSAP ScrollTrigger) - 끝까지 유지되는 전역 "스륵 스륵" 물리 스크롤
      let lenisInstance = null;

      function initGlobalSmoothScroll() {
        if (typeof Lenis === 'undefined') return;

        if (lenisInstance) {
          lenisInstance.destroy();
        }

        lenisInstance = new Lenis({
          duration: 1.2,
          easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
          orientation: 'vertical',
          gestureOrientation: 'vertical',
          smoothWheel: true,
          wheelMultiplier: 1.0,
          touchMultiplier: 1.5,
          infinite: false
        });

        lenisInstance.on('scroll', ScrollTrigger.update);

        gsap.ticker.add((time) => {
          lenisInstance.raf(time * 1000);
        });

        gsap.ticker.lagSmoothing(0);
      }

      // GSAP ScrollTrigger "스륵 스르륵" Velvet-Smooth Curtain Motion
      function initGsapCurtainMotion() {
        if (typeof gsap === 'undefined' || typeof ScrollTrigger === 'undefined') return;

        gsap.registerPlugin(ScrollTrigger);

        // Kill previous triggers if any
        ScrollTrigger.getAll().forEach(t => t.kill());

        // 1. Whole White Container smoothly glides and covers ("스륵 스륵")
        gsap.fromTo("#sub-body-container",
          {
            y: 100
          },
          {
            y: 0,
            ease: "none",
            scrollTrigger: {
              trigger: "#home",
              start: "top top",
              end: "bottom top",
              scrub: 1.0 // Lenis와 완벽 연동되는 최적의 1.0s 스크럽
            }
          }
        );
      }

      // History Scroll Animation Controller (연도 블록별 부드러운 스크롤 등장)
      function initTimelineScrollAnimation() {
        const sections = document.querySelectorAll('.history-year-block.scroll-reveal');
        if (!sections.length) return;

        if ('IntersectionObserver' in window) {
          const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
              if (entry.isIntersecting) {
                entry.target.classList.add('in-view');
              }
            });
          }, {
            rootMargin: '0px 0px -8% 0px',
            threshold: 0.1
          });

          sections.forEach(el => observer.observe(el));
        } else {
          sections.forEach(el => el.classList.add('in-view'));
        }
      }

      // Smart Header: 서브비주얼(#home) 구간은 항상 노출, 본문 진입 이후 스크롤 다운 시 숨김 / 업 시 등장
      function initSmartHeader() {
        const header = document.querySelector('header');
        if (!header) return;

        let lastScrollY = window.scrollY || 0;
        let isHidden = false;

        const onScroll = (currentY) => {
          const scrollY = typeof currentY === 'number' ? currentY : (window.scrollY || 0);

          // 1. 서브비주얼(#home)이 화면에 보이는 동안에는 헤더를 항상 100% 노출
          const homeEl = document.getElementById('home');
          const visualThreshold = homeEl ? (homeEl.offsetHeight - 120) : 600;

          if (scrollY < visualThreshold || header.classList.contains('sub-open') || header.classList.contains('menu-hovered')) {
            if (isHidden) {
              header.classList.remove('header-hidden');
              isHidden = false;
            }
            lastScrollY = scrollY;
            return;
          }

          const delta = scrollY - lastScrollY;

          // 2. 본문 컨텐츠 영역에서 스크롤 방향에 따른 스마트 제어
          if (delta > 8 && !isHidden) {
            // 아래로 스크롤: 헤더를 위로 부드럽게 숨김
            header.classList.add('header-hidden');
            isHidden = true;
          } else if (delta < -8 && isHidden) {
            // 위로 스크롤: 헤더가 부드럽게 내려오며 노출
            header.classList.remove('header-hidden');
            isHidden = false;
          }

          lastScrollY = scrollY;
        };

        if (lenisInstance) {
          lenisInstance.on('scroll', (e) => onScroll(e.scroll));
        } else {
          window.addEventListener('scroll', () => onScroll(window.scrollY), { passive: true });
        }
      }

      // Initialize on load
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
          applySubPageState();
          initGlobalSmoothScroll();
          initSmartHeader();
          setTimeout(initGsapCurtainMotion, 100);
        });
      } else {
        applySubPageState();
        initGlobalSmoothScroll();
        initSmartHeader();
        setTimeout(initGsapCurtainMotion, 100);
      }

      // Realtime cross-tab synchronization
      window.addEventListener('storage', (e) => {
        if (e.key === STORAGE_KEY || e.key === 'WEB_BUILDER_STUDIO_STATE_V1' || e.key === 'WEB_BUILDER_CALENDAR_EVENTS_V1' || e.key === 'WEB_BUILDER_CUSTOM_HISTORY_V1' || e.key === 'WEB_BUILDER_CUSTOM_ORG_V1' || e.key === 'WEB_BUILDER_CUSTOM_FAQ_V1') {
          applySubPageState();
        }
      });

      window.addEventListener('message', (e) => {
        if (e.data && e.data.type === 'BUILDER_STATE_UPDATE') {
          applySubPageState();
        }
      });
    })();
  </script>
</body>
</html>
